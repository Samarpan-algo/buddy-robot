; PlatformIO project for "Buddy" the robot car.
; Each test sketch lives in its own folder under src/ and has its own env.
; Build/upload one env with:  pio run -e <env> -t upload

[platformio]
default_envs = main

; Settings shared by every env
[env]
platform = espressif32@7.1.3   ; pinned: Arduino core 2.0.17 (2.x LEDC API)
board = esp32dev
framework = arduino
; Set your own serial port if auto-detect picks the wrong one, e.g.:
; upload_port = COM8
; monitor_port = COM8
monitor_speed = 115200
; Step 0: blink GPIO2 + print chip info
[env:test_toolchain]
build_src_filter = +<test_toolchain/>

; Step 1.1: I2C scan + OLED test pattern + animated eyes
[env:test_oled]
build_src_filter = +<test_oled/>
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SH110X@2.1.15
    fluxgarage/FluxGarage RoboEyes@1.1.1

; Step 1.2: interactive motor test (wheels lifted!)
[env:test_motors]
build_src_filter = +<test_motors/>
monitor_echo = yes

; Step 1.3: HC-SR04 distance, rear IR, buzzer, WS2812 RGB LED
[env:test_sensors]
build_src_filter = +<test_sensors/>
monitor_echo = yes
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5

; Main firmware (Phase 1): eyes + sensors + mood engine + sound/RGB + drive
[env:main]
build_src_filter = +<main/>
monitor_echo = yes
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SH110X@2.1.15
    fluxgarage/FluxGarage RoboEyes@1.1.1
    adafruit/Adafruit NeoPixel@1.15.5

; Step H1: speaker test (GPIO5 PWM -> RC filter -> PAM8403 -> speaker)
[env:test_audio]
build_src_filter = +<test_audio/>
monitor_echo = yes

; Step H2: mic test (INMP441 I2S -> level meter -> record 3 s -> play on speaker)
[env:test_mic]
build_src_filter = +<test_mic/>
monitor_echo = yes
